[project]
name = "gsim-tools"
version = "0.1.0"
description = "Pure-Python tooling for general-simulator: schematic building, result parsing, and waveform measurement."
requires-python = ">=3.11"
license = { file = "LICENSE" }
readme = "README.md"
# No runtime dependencies at all: result parsing (CSV), waveform measurement, and log parsing
# are stdlib-only, so `pip install gsim-tools` needs no compiler and no Rust toolchain.
dependencies = []

[project.optional-dependencies]
# Reading kernel-sidecar SIMULATE_RESULT manifests (manifest.json + data.h5, or the older
# time.npy/signals/*.npy layout). Wheels exist for both on every supported platform.
sidecar = [
    "numpy>=1.26",
    "h5py>=3.11",
]
# gsim_tools.schematic needs `gsim_py`, which is NOT on PyPI -- it is a local PyO3 extension
# built from the sibling gsim-core repository, so this extra installs nothing and exists to
# document the requirement:
#
#     cd <path to>/gsim-core/crates/gsim-py
#     python3 -m venv .venv && source .venv/bin/activate
#     pip install maturin && maturin develop --release
#
# then install gsim-tools into that same virtualenv. gsim_tools.schematic raises
# GsimPyNotAvailable with these instructions if it is missing.
schematic = []
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsim_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gsim_py: requires the gsim_py extension module (built from gsim-core via maturin)",
    "simulator: requires the general-simulator binary on PATH or at $GSIM_SIMULATOR",
]
