[project]
name = "gsim-tools"
version = "0.1.0"
description = "Build circuit and control schematics in Python, compile them to netlists, and measure the waveforms that come back."
requires-python = ">=3.11"
license = { file = "LICENSE" }
readme = "README.md"
# No runtime dependencies at all: result parsing (CSV), waveform measurement, and log parsing
# are stdlib-only, so `pip install gsim-tools` needs no compiler and no Rust toolchain.
dependencies = []
keywords = [
    "circuit",
    "schematic",
    "simulation",
    "netlist",
    "spice",
    "power-electronics",
    "control-systems",
    "waveform",
    "measurement",
    "thd",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/GLODI-Engineering/gsim-tools"
Source = "https://github.com/GLODI-Engineering/gsim-tools"
Issues = "https://github.com/GLODI-Engineering/gsim-tools/issues"
"The engine" = "https://github.com/GLODI-Engineering/general-simulator"
"The Rust core (gsim_py)" = "https://github.com/GLODI-Engineering/gsim-core"
"Omni Schematics (the editor)" = "https://github.com/GLODI-Engineering/omni-schematics"

[project.optional-dependencies]
# Reading kernel-sidecar SIMULATE_RESULT manifests (manifest.json + data.h5, or the older
# time.npy/signals/*.npy layout). Wheels exist for both on every supported platform.
sidecar = [
    "numpy>=1.26",
    "h5py>=3.11",
]
# `gsim_tools.schematic` -- the main surface -- needs `gsim_py`, the PyO3 extension built
# from gsim-core. It is published on crates.io (0.5.0), but a crates.io release is source and
# not a wheel, so this extra still installs nothing and exists to name the requirement; once
# `gsim-py` publishes wheels this becomes `schematic = ["gsim-py>=0.5"]` and a single
# `pip install gsim-tools[schematic]` is enough.
#
# Until then, build it once:
#
#     git clone https://github.com/GLODI-Engineering/gsim-core
#     cd gsim-core/crates/gsim-py && pip install maturin && maturin build --release
#     pip install ../../target/wheels/gsim_py-*.whl
#
# into the same environment as gsim-tools. Every entry point in `schematic` raises
# GsimPyNotAvailable with these instructions when it is missing -- including the
# `Schematic(...)` constructor, since the document model itself lives in the core.
schematic = []
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsim_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gsim_py: requires the gsim_py extension module (built from gsim-core via maturin)",
    "simulator: requires the general-simulator binary on PATH or at $GSIM_SIMULATOR",
]

[tool.ruff]
# The package supports 3.11+ (`requires-python`), and the code is written to 100 columns:
# at ruff's default 88 this tree reports 480 long lines, at 100 it reports three.
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Explicit, so the gate means one thing from one ruff release to the next. pycodestyle +
# pyflakes are the floor; isort keeps import blocks stable across contributors; pyupgrade and
# flake8-bugbear are the two that catch real defects rather than style (a mutable default, a
# loop variable captured by a closure); ruff's own rules catch what the others miss.
select = ["E", "W", "F", "I", "UP", "B", "RUF"]
# `__all__` and `__slots__` are grouped here by concept -- types, then errors, then functions --
# which is information an alphabetical sort would throw away. RUF022/RUF023 want them sorted.
ignore = ["RUF022", "RUF023"]

# `ruff format` is deliberately NOT a gate. It would reformat 9 of the 16 files (~190 changed
# lines) in a tree that is hand-wrapped to carry meaning -- argument lists broken where the
# argument groups are, tables aligned to be read as tables. That is a separate decision with a
# separate diff, not something to smuggle in with a lint configuration. `ruff check` covers the
# rules that catch defects; formatting stays the author's.
