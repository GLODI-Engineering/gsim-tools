name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what pyproject declares (>=3.11); the ceiling catches
        # a deprecation before it becomes a break. No lint step: this package
        # has no ruff configuration yet, and a CI that fails on day one for
        # reasons unrelated to the change teaches people to ignore it.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create the environment
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e '.[dev]'

      - name: pytest
        run: .venv/bin/python -m pytest -q
